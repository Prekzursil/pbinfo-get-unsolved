<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pbinfo-get-unsolved options</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        margin: 0 auto;
        padding: 24px;
        max-width: 760px;
        background: #f8fafc;
        color: #0f172a;
      }
      h1 {
        margin-top: 0;
      }
      form {
        display: grid;
        gap: 14px;
      }
      label {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      input[type='number'],
      select {
        padding: 8px 10px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: white;
      }
      button {
        width: fit-content;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 10px 14px;
        background: white;
        cursor: pointer;
      }
      .muted {
        color: #475569;
      }
    </style>
  </head>
  <body>
    <h1>pbinfo-get-unsolved options</h1>
    <p class="muted">
      Setările de aici sunt aplicate de shell-ul extension înainte să pornească overlay-ul din
      pagină.
    </p>
    <form id="options-form">
      <label><input id="verify-unsolved" type="checkbox" /> Verify unsolved after scan</label>
      <label><input id="cache-enabled" type="checkbox" /> Enable parsed-result cache</label>
      <label><input id="force-refresh" type="checkbox" /> Force refresh for each run</label>
      <label>
        Cache TTL (minute)
        <input id="cache-ttl" type="number" min="1" step="1" />
      </label>
      <label>
        Navigation scope
        <select id="nav-scope">
          <option value="visible">visible unsolved</option>
          <option value="all">all unsolved</option>
        </select>
      </label>
      <button type="submit">Save options</button>
    </form>
    <p id="status" class="muted"></p>
    <script src="options.js"></script>
  </body>
</html>
