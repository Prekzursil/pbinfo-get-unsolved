<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pbinfo-get-unsolved</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        margin: 0;
        padding: 12px;
        min-width: 280px;
        background: #f8fafc;
        color: #0f172a;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 16px;
      }
      p {
        margin: 0 0 10px;
        line-height: 1.4;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      button,
      a {
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 9px 11px;
        background: white;
        color: inherit;
        text-decoration: none;
        text-align: center;
        cursor: pointer;
      }
      .muted {
        color: #475569;
        font-size: 12px;
      }
      #status {
        min-height: 18px;
      }
    </style>
  </head>
  <body>
    <h1>pbinfo-get-unsolved</h1>
    <p id="summary" class="muted">Încarc setările…</p>
    <div class="actions">
      <button id="launch">Launch overlay</button>
      <button id="open-pbinfo">Open pbinfo.ro</button>
      <button id="open-options">Open options</button>
    </div>
    <p id="status" class="muted"></p>
    <script src="popup.js"></script>
  </body>
</html>
