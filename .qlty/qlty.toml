config_version = "0"

exclude_patterns = [
  "coverage/**",
  "coverage-100/**",
  "dist/**",
  "node_modules/**",
  ".tmp*/**",
  "package-lock.json",
]

test_patterns = [
  "tests/**/*.test.js",
]

[[source]]
name = "default"
default = true

[smells]
mode = "block"

[[plugin]]
name = "actionlint"
mode = "block"

[[plugin]]
name = "prettier"
version = "3.4.2"
mode = "block"
