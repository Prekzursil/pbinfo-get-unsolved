name: Codacy Zero

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codacy-zero:
    name: Codacy Zero
    runs-on: ubuntu-latest
    env:
      QUALITY_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      EXPECTED_ANALYSIS_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Assert Codacy zero-open gate
        env:
          CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
        run: |
          python3 scripts/quality/check_codacy_zero.py \
            --owner "${GITHUB_REPOSITORY_OWNER}" \
            --repo "${GITHUB_REPOSITORY#*/}" \
            --branch "${QUALITY_BRANCH}" \
            --expected-sha "${EXPECTED_ANALYSIS_SHA}" \
            --timeout-seconds 1200 \
            --poll-seconds 20 \
            --out-json "codacy-zero/codacy.json" \
            --out-md "codacy-zero/codacy.md"
      - name: Upload Codacy artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codacy-zero
          include-hidden-files: false
          path: codacy-zero
