# CodeQL — fleet ADVANCED configuration (self-contained).
#
# Replaces the quality-zero-platform reusable-codeql.yml caller: that wrapper
# pins queries to security-and-quality only, while the fleet standard (owner
# decision) requires BOTH suites inline:
#   queries: security-extended,security-and-quality
# (security-extended + security-and-quality strictly subsumes the default
# suite and the extended suite.) Languages per this repository: JavaScript/
# TypeScript plus the workflows' own actions. The repo's own quality suite
# (quality.yml) keeps running beside this analysis unchanged.
name: CodeQL

permissions:
  actions: read
  contents: read
  security-events: write

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
