name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Test with coverage
        run: npm run test:coverage

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build dist artifacts (userscript + extensions)
        run: npm run build

      - name: Upload extension artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extension-artifacts
          path: |
            dist/pbinfo-get-unsolved-chrome-*.zip
            dist/pbinfo-get-unsolved-firefox-*.xpi
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn
          retention-days: 14
