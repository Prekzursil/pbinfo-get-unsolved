name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node >= 22.9: the coverage-gate CLI flags (--test-coverage-lines,
          # --test-coverage-branches, --test-coverage-functions,
          # --test-coverage-exclude) do not exist on Node 20, which is EOL
          # since 2026-04-30. Keep this in sync with the quality workflow.
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Test with coverage gate (100% lines / branches / functions)
        run: npm run test:coverage

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build dist artifacts
        run: npm run build:bookmarklet
