name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          package-manager-cache: false

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Format check
        run: npm run format:check

      - name: Build dist artifacts
        run: npm run build:bookmarklet

      - name: Generate checksums
        run: |
          cd dist
          sha256sum \
            pbinfo-get-unsolved.userscript.js \
            pbinfo-get-unsolved.min.js \
            pbinfo-get-unsolved.bookmarklet.txt \
            > checksums.sha256

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          assets=(
            dist/pbinfo-get-unsolved.userscript.js
            dist/pbinfo-get-unsolved.min.js
            dist/pbinfo-get-unsolved.bookmarklet.txt
            dist/checksums.sha256
          )

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${assets[@]}" --clobber
          else
            gh release create "${tag}" "${assets[@]}" --generate-notes
          fi
