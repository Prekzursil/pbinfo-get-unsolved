name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to release (optional for manual runs)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # Node 20 is EOL (2026-04-30); keep release builds on the same
          # LTS line as CI (see ci.yml).
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Format check
        run: npm run format:check

      - name: Build dist artifacts
        run: npm run build:bookmarklet

      - name: Generate checksums
        run: |
          cd dist
          sha256sum \
            pbinfo-get-unsolved.userscript.js \
            pbinfo-get-unsolved.min.js \
            pbinfo-get-unsolved.bookmarklet.txt \
            > checksums.sha256

      - name: Resolve release tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          # Tag values flow into git refs and release names: reject anything
          # outside [A-Za-z0-9._-] (also the defense SonarCloud S7630 asks for
          # on top of env indirection).
          case "$TAG" in
            ''|*[!A-Za-z0-9._-]*)
              echo "::error::Refusing unsafe release tag: $TAG" >&2
              exit 1
              ;;
          esac
          echo "value=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          generate_release_notes: true
          files: |
            dist/pbinfo-get-unsolved.userscript.js
            dist/pbinfo-get-unsolved.min.js
            dist/pbinfo-get-unsolved.bookmarklet.txt
            dist/checksums.sha256
