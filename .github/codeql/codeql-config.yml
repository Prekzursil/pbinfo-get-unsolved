name: "pbinfo-get-unsolved CodeQL config"

# Fleet CODEQL DECISION (owner): BOTH suites must run. The QZP
# reusable-codeql.yml wrapper pins `queries: security-and-quality` on the
# init step and is kept as the caller (its PR-head checkout and fail-closed
# `codeql / CodeQL` gate job are what the repo's "CodeQL security
# red-blocker" ruleset is built against). CodeQL MERGES config-file queries
# with the init queries input, so declaring security-extended here yields
# security-extended + security-and-quality — strictly subsuming the default
# and extended suites.
queries:
  - uses: security-extended
