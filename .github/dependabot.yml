# Managed by quality-zero-platform (docs/FLEET-BASELINE.md).
# One update rail per manifest tree, for every ecosystem in this repository.
# Security updates are grouped per ecosystem so one pull request can clear
# every open advisory (the dependency gate fails on ANY known advisory);
# minor/patch updates are grouped; majors are never ignored and arrive one
# by one. Regenerate with scripts/quality/fleet_baseline.py instead of
# hand-editing, so a new manifest can never be left without a rail.
version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  labels:
  - dependencies
  groups:
    github-actions-security:
      applies-to: security-updates
      patterns:
      - '*'
    github-actions-minor-patch:
      applies-to: version-updates
      patterns:
      - '*'
      update-types:
      - minor
      - patch
- package-ecosystem: npm
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  labels:
  - dependencies
  groups:
    npm-security:
      applies-to: security-updates
      patterns:
      - '*'
    npm-minor-patch:
      applies-to: version-updates
      patterns:
      - '*'
      update-types:
      - minor
      - patch
